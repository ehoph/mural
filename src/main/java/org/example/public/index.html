<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de recados</title>
    <style>
        *{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body{
            background-color: #252d30;
            color: #222;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header{
            background-color: #e30613;
            color: #fff;
            padding: 24px;
            text-align: center;
        }
        main{
            width: min(700px, 92%);
            margin: 28px auto;
        }
        form, article{
            background-color: #3d3d3d;
            padding: 18px;
            margin-bottom: 14px;
            border-radius: 8px;
        }
        input, textarea, button{
            width: 100%;
            padding: 11px;
            margin: 8px 0 14px;
            font: inherit;
            color: #ffffff;
            background-color: #3d3d3d;
            border: 1px solid red;
        }
        textarea{
            min-height: 90px;
            resize: vertical;
        }
        label{
            color: #ffffff;
        }

        button{
            background-color: #e30613;
            color: #f4f4f4;
            border: 0;
            cursor: pointer;
            font-weight: bold;
            transition: all ease 0.6s;
        }
        button:hover{
            background-color: #b9040e;
        }
        h2{
            margin-top: 28px;
            color: #ffffff;
        }
        article{
            border-left: 5px solid #e30613; 
        }
        article p {
            margin-bottom: 0;
        }

        #aviso{
            min-height: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>Mural de recados</h1>
    </header>

    <main>
        <form action="" id="form-recado">
            <label for="autor">Autor</label>
            <input id="autor" name="autor" maxlength="80" required>

            <label for="mensagem">Recado</label>
            <textarea id="mensagem" name="mensagem" maxlength="255" required></textarea>

            <button type="submit">Publicar Recado</button>

            <p id="aviso">
                <h2>Recados Publicados</h2>
                <section id="listade-recados"></section>
            </p>
        </form>
    </main>
</body>
</html>
